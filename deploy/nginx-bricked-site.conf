# Bricked Sorting public site. Static files only, from the GitHub checkout.
# Bound to localhost; the Cloudflare tunnel is the only way in.
# cloudflared reaches "localhost" as ::1, so listen on both.
#
# /camera-stream, /camera-snapshot and /camera-health come from the camera relay on this
# same CT 150 (kratos/camera-relay, port 8002). The Pi pushes frames to it over Tailscale,
# because CT 150 can't open connections to the Pi. deploy/setup-camera-proxy.sh writes
#     /etc/nginx/conf.d/bricked-pi-camera.conf:  upstream bricked_pi_camera { server 127.0.0.1:8002; }

# At most 6 people watching the stream at once (keeps CT 150's upload to Cloudflare small).
limit_conn_zone $server_name zone=bricked_cam:1m;

server {
    listen 127.0.0.1:8090;
    listen [::1]:8090;
    server_name bricked-01.adsuaracloud.com;

    root /opt/bricked-site/web;
    index index.html;
    disable_symlinks on;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /camera-stream {
        limit_conn bricked_cam 6;
        limit_conn_status 503;
        proxy_pass http://bricked_pi_camera/stream;   # 640 px, about 5 fps (the Pi sends the small copy)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;                 # pass frames through as they come
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;              # Pi stops sending -> close, the page reconnects
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }
    location = /camera-login {               # team password -> cookie (relay checks it)
        limit_except POST { deny all; }
        client_max_body_size 2k;
        proxy_pass http://bricked_pi_camera/login;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
    location = /camera-session {
        proxy_pass http://bricked_pi_camera/session;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
    location = /camera-health {
        proxy_pass http://bricked_pi_camera/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
    location = /camera-snapshot {
        proxy_pass http://bricked_pi_camera/snapshot;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
