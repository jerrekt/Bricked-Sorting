# Bricked Sorting public site. Static files only, from the GitHub checkout.
# Bound to localhost; the Cloudflare tunnel is the only way in.
# cloudflared reaches "localhost" as ::1, so listen on both.
server {
    listen 127.0.0.1:8090;
    listen [::1]:8090;
    server_name bricked-01.adsuaracloud.com;

    root /opt/bricked-site/web;
    index index.html;
    disable_symlinks on;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
