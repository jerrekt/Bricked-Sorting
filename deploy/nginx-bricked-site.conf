# Bricked Sorting public site. Static files only, from the GitHub checkout.
# Bound to localhost; the Cloudflare tunnel is the only way in.
# cloudflared reaches "localhost" as ::1, so listen on both.
#
# /camera-stream and /camera-snapshot proxy the Pi camera server (identify/camera_stream.py,
# port 8001) over Tailscale. The Pi's address is NOT in this repo: it lives in
# /etc/nginx/conf.d/bricked-pi-camera.conf on CT 150 (see deploy/setup-camera-proxy.sh):
#     upstream bricked_pi_camera { server <PI_TAILNET_IP>:8001; }

# At most 6 people watching the stream at once (each one is a separate stream from the Pi).
limit_conn_zone $server_name zone=bricked_cam:1m;

server {
    listen 127.0.0.1:8090;
    listen [::1]:8090;
    server_name bricked-01.adsuaracloud.com;

    root /opt/bricked-site/web;
    index index.html;
    disable_symlinks on;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /camera-stream {
        limit_conn bricked_cam 6;
        limit_conn_status 503;
        proxy_pass http://bricked_pi_camera/stream?public=1;   # 640 px, 5 fps
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;                 # pass frames through as they come
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;              # Pi stops sending -> close, the page reconnects
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }
    location = /camera-health {
        proxy_pass http://bricked_pi_camera/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
    location = /camera-snapshot {
        proxy_pass http://bricked_pi_camera/snapshot?public=1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
