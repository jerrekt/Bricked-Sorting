# /etc/cloudflared/config.yml in the bots container. One hostname per bot.
tunnel: <tunnel-id>
credentials-file: /etc/cloudflared/<tunnel-id>.json
ingress:
  - hostname: <claim api hostname>
    service: http://127.0.0.1:8701
  # - hostname: <next bot hostname>
  #   service: http://127.0.0.1:8702
  - service: http_status:404
